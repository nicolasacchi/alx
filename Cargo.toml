[package]
name = "alx"
version = "0.2.0"
edition = "2021"
description = "Algolia cost & abuse forensics CLI (read-only)"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
colored = "3"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
sysinfo = "0.40"
clap_complete = "4"
clap_mangen = "0.3"
hickory-resolver = "0.26"

[dev-dependencies]
wiremock = "0.6"
assert_cmd = "2"
predicates = "3"
tempfile = "3"
